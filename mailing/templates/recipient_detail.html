{% extends 'base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
    <div class="container">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
            <div class="col">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <p class="card-text">{{ recipient }}</p>
                        <p class="card-text">email Получателя: {{ recipient.email }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <button type="button" class="btn btn-sm btn-outline-secondary"><a href="{% url 'mailing:recipient_list' %}" class="text-black">Список получателей</a></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary"><a href="{% url 'mailing:recipient_delete' recipient.pk %}" class="text-black">Удалить получателя</a></button>
                            <button type="button" class="btn btn-sm btn-outline-secondary"><a href="{% url 'mailing:recipient_update' recipient.pk %}" class="text-black">Редактировать получателя</a></button>
                        </div>
                        <small class="text-body-secondary">Автор: {{ object.owner }} </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
