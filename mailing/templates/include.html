<div class="collapse text-bg-dark" id="navbarHeader">
    <div class="container">
        <div class="row">
            <div class="col-sm-8 col-md-7 py-4">
                <h4>Сервис рассылок</h4>
            </div>
            <div class="col-sm-4 offset-md-1 py-4">
                <h4>Навигация</h4>
                <ul class="list-unstyled">
                    {% if user.is_authenticated %}
                    <li><a href="{% url 'mailing:index' %}" class="text-white">На главную</a></li>
                    <li><a href="{% url 'mailing:mailing_list' %}" class="text-white">Рассылки</a></li>
                    <li><a href="{% url 'mailing:message_list' %}" class="text-white">Сообщения</a></li>
                    <li><a href="{% url 'mailing:recipient_list' %}" class="text-white">Получатели</a></li>

                    <li><a href="{% url 'mailing:logs_list' %}" class="text-white">Логи</a></li>

                    <li><a href="{% url 'users:profile' %}" class="text-white">Профиль</a></li>
                    {% else %}
                    <li><a href="{% url 'users:login' %}" class="text-white">Вход</a></li>
                    <li><a href="{% url 'users:registration' %}" class="text-white">Регистрация</a></li>
                    {% endif %}
                    <li><a href="/admin/" class="text-white">Админ.панель</a></li>
                    <li>
                        <form action="{% url 'users:logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-light">Выйти</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<div class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a href="#" class="navbar-brand d-flex align-items-center">
            <strong>Сервис рассылок</strong>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarHeader"
                aria-controls="navbarHeader" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</div>
